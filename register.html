<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daftar - KantinKu SMK Telkom</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-left">
      <div class="auth-brand">
        <div class="brand-logo">
          <img src="assets/logo-smktelkom.png" alt="SMK Telkom Malang" style="width:48px;height:48px;object-fit:contain;filter:brightness(0) invert(1);"/>
        </div>
        <h1>KantinKu</h1>
        <p>Daftar dan mulai pesan<br/>makanan favoritmu!</p>
      </div>
      <div class="auth-illustration">
        <div class="floating-card card-1"><i class="fas fa-user-graduate"></i> Siswa</div>
        <div class="floating-card card-2"><i class="fas fa-chalkboard-teacher"></i> Guru</div>
        <div class="floating-card card-3"><i class="fas fa-briefcase"></i> Karyawan</div>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-form-wrapper">
        <h2>Buat Akun Baru</h2>
        <p class="auth-subtitle">Gunakan email sekolah untuk mendaftar</p>

        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label><i class="fas fa-user"></i> Nama Lengkap</label>
            <input type="text" id="reg-name" placeholder="Nama lengkap kamu" required />
          </div>

          <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email Sekolah</label>
            <input type="email" id="reg-email" placeholder="nama@smktelkom.sch.id" required />
          </div>

          <div class="form-group">
            <label><i class="fas fa-id-badge"></i> Role</label>
            <select id="reg-role" onchange="toggleRoleField()" required>
              <option value="">-- Pilih Role --</option>
              <option value="siswa">Siswa</option>
              <option value="guru">Guru</option>
              <option value="karyawan">Karyawan</option>
            </select>
          </div>

          <div class="form-group" id="field-kelas">
            <label><i class="fas fa-school"></i> Kelas</label>
            <input type="text" id="reg-kelas" placeholder="Contoh: XII RPL 1" />
          </div>

          <div class="form-group" id="field-jabatan" style="display:none;">
            <label><i class="fas fa-briefcase"></i> Jabatan / Divisi</label>
            <input type="text" id="reg-jabatan" placeholder="Contoh: Wali Kelas / TU" />
          </div>

          <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <div class="input-password">
              <input type="password" id="reg-password" placeholder="Minimal 8 karakter" required />
              <button type="button" onclick="togglePasswordReg()" class="toggle-pw"><i class="fas fa-eye" id="eyeIconReg"></i></button>
            </div>
          </div>

          <div class="form-group">
            <label><i class="fas fa-lock"></i> Konfirmasi Password</label>
            <input type="password" id="reg-confirm" placeholder="Ulangi password" required />
          </div>

          <button type="submit" class="btn-primary btn-full">
            <i class="fas fa-user-plus"></i> Daftar Sekarang
          </button>
        </form>

        <div class="auth-divider"><span>atau</span></div>
        <p class="auth-switch">Sudah punya akun? <a href="index.html">Masuk di sini</a></p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
