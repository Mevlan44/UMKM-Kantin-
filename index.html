<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KantinKu - SMK Telkom</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-left">
      <div class="auth-brand">
        <div class="brand-logo">
          <img src="assets/logo-smktelkom.png" alt="SMK Telkom Malang" style="width:48px;height:48px;object-fit:contain;mix-blend-mode:multiply;"/>
        </div>
        <h1>KantinKu</h1>
        <p>Platform pemesanan makanan resmi<br/>SMK Telkom Malang</p>
      </div>
      <div class="auth-illustration">
        <div class="floating-card card-1"><i class="fas fa-bowl-food"></i> Ramen Kari</div>
        <div class="floating-card card-2"><i class="fas fa-drumstick-bite"></i> Ayam Goreng</div>
        <div class="floating-card card-3"><i class="fas fa-bowl-rice"></i> Soto Jumbo</div>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-form-wrapper">
        <h2>Selamat Datang!</h2>
        <p class="auth-subtitle">Masuk dengan akun sekolah kamu</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i> Email Sekolah</label>
            <input type="email" id="email" placeholder="nama@smktelkom.sch.id" required />
          </div>
          <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Password</label>
            <div class="input-password">
              <input type="password" id="password" placeholder="Masukkan password" required />
              <button type="button" onclick="togglePassword()" class="toggle-pw"><i class="fas fa-eye" id="eyeIcon"></i></button>
            </div>
          </div>
          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="remember"/> Ingat saya
            </label>
            <a href="#" class="forgot-link">Lupa password?</a>
          </div>
          <button type="submit" class="btn-primary btn-full">
            <i class="fas fa-sign-in-alt"></i> Masuk
          </button>
        </form>

        <div class="auth-divider"><span>atau</span></div>

        <p class="auth-switch">Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
