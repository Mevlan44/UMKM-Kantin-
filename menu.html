<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu Kantin - KantinKu</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/menu.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="app-body">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-left">
      <button class="back-btn" onclick="window.location.href='home.html'">
        <i class="fas fa-arrow-left"></i>
      </button>
      <span class="navbar-title" id="kantinTitle">Menu Kantin</span>
    </div>
    <div class="navbar-right">
      <button class="nav-icon-btn cart-btn" onclick="toggleCart()">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
    </div>
  </nav>

  <!-- KANTIN HEADER -->
  <div class="kantin-header" id="kantinHeader">
    <div class="kantin-header-info">
      <div class="kantin-avatar" id="kantinAvatar">
        <i class="fas fa-store"></i>
      </div>
      <div>
        <h2 id="kantinName">Kantin 1</h2>
        <p id="kantinDesc">Pilih menu favoritmu</p>
        <div class="kantin-meta">
          <span><i class="fas fa-clock"></i> Buka 07.00 - 14.00</span>
          <span><i class="fas fa-star"></i> 4.8</span>
        </div>
      </div>
    </div>
  </div>

  <!-- CATEGORY TABS -->
  <div class="category-tabs" id="categoryTabs">
    <button class="tab-btn active" onclick="filterCategory('semua', this)">Semua</button>
    <button class="tab-btn" onclick="filterCategory('makanan', this)">Makanan</button>
    <button class="tab-btn" onclick="filterCategory('minuman', this)">Minuman</button>
  </div>

  <!-- MENU LIST -->
  <main class="main-content menu-main">
    <div class="menu-grid" id="menuGrid">
      <!-- Generated by JS -->
    </div>
  </main>

  <!-- CART BOTTOM BAR -->
  <div class="cart-bar" id="cartBar" style="display:none;">
    <div class="cart-bar-info">
      <span id="cartCount">0 item</span>
      <span id="cartTotal">Rp 0</span>
    </div>
    <button class="btn-primary" onclick="window.location.href='payment.html'">
      Lanjut Bayar <i class="fas fa-arrow-right"></i>
    </button>
  </div>

  <!-- CART DRAWER -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-drawer-header">
      <h4><i class="fas fa-shopping-cart"></i> Keranjang</h4>
      <button onclick="toggleCart()"><i class="fas fa-times"></i></button>
    </div>
    <div class="cart-items" id="cartItems">
      <div class="cart-empty">
        <i class="fas fa-shopping-cart"></i>
        <p>Keranjang masih kosong</p>
      </div>
    </div>
    <div class="cart-footer" id="cartFooter" style="display:none;">
      <div class="cart-total-row">
        <span>Total</span>
        <strong id="cartTotalDrawer">Rp 0</strong>
      </div>
      <button class="btn-primary btn-full" onclick="goToPayment()">
        <i class="fas fa-credit-card"></i> Lanjut ke Pembayaran
      </button>
    </div>
  </div>

  <!-- ITEM DETAIL MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
  <div class="item-modal" id="itemModal">
    <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    <div class="modal-img" id="modalImg"><i class="fas fa-bowl-food"></i></div>
    <div class="modal-body">
      <h3 id="modalName">Nama Item</h3>
      <p id="modalDesc">Deskripsi item</p>
      <div class="modal-price" id="modalPrice">Rp 0</div>
      <div class="modal-options" id="modalOptions"></div>
      <div class="modal-qty">
        <button onclick="changeQty(-1)"><i class="fas fa-minus"></i></button>
        <span id="modalQty">1</span>
        <button onclick="changeQty(1)"><i class="fas fa-plus"></i></button>
      </div>
      <button class="btn-primary btn-full" onclick="addToCartFromModal()">
        <i class="fas fa-cart-plus"></i> Tambah ke Keranjang
      </button>
    </div>
  </div>

  <script src="js/menu.js"></script>
</body>
</html>
